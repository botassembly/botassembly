name: runtime

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # bot/vitest.config.ts halves the cores by default (ticket 0287); this
      # runner has four and none of it is shared, so it stays uncapped.
      BOT_TEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: bot/npm-shrinkwrap.json
      - run: npm install --global npm@10.9.8
      - run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - run: sh sdlc/scripts/install
      - run: test "$(id -u)" -ne 0
      - run: git cat-file -e 'HEAD^{commit}' || exit 1; commit=$(git cat-file commit HEAD) || exit 1; header=$(printf '%s\n' "$commit" | sed -n '2p') || exit 1; case "$header" in parent\ *) git rev-parse --verify HEAD^ >/dev/null 2>&1;; author\ *) true;; *) exit 1;; esac
      - run: make check
      - run: make -C bot coverage
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: bot/npm-shrinkwrap.json
      - run: make -C bot install
      - run: test "$(id -u)" -ne 0
      - run: make platformcheck
  wsl:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Debian-13
          wsl-version: 2
          additional-packages: git curl ca-certificates xz-utils make
          wsl-shell-user: builder
      - env:
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The wsl-bash wrapper runs wsl.exe as a Windows-side process; WSL
          # interop only carries a step's env: values into the distribution
          # for the names listed here.
          WSLENV: SERVER:REPOSITORY:SHA
        run: |
          git init /home/builder/repo
          cd /home/builder/repo
          git remote add origin "$SERVER/$REPOSITORY.git"
          git fetch --depth 1 origin "$SHA"
          git checkout FETCH_HEAD
      - run: |
          cd /home/builder
          curl -fsSLO https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz
          echo "9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37  node-v22.22.0-linux-x64.tar.xz" | sha256sum -c -
          mkdir -p /home/builder/node
          tar -xJf node-v22.22.0-linux-x64.tar.xz -C /home/builder/node --strip-components=1
      - run: |
          export PATH="/home/builder/node/bin:$PATH"
          cd /home/builder/repo
          test "$(id -u)" -ne 0
      - run: |
          export PATH="/home/builder/node/bin:$PATH"
          cd /home/builder/repo
          make -C bot install
      - run: |
          export PATH="/home/builder/node/bin:$PATH"
          cd /home/builder/repo
          make platformcheck
